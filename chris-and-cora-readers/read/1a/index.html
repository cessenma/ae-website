<script>
const book=document.getElementById('book'),pages=book.querySelectorAll('.page');
const pf=new St.PageFlip(book,{width:758,height:1075,size:'stretch',minWidth:120,maxWidth:1600,
  minHeight:180,maxHeight:1200,showCover:true,usePortrait:false,maxShadowOpacity:.35,
  mobileScrollSupport:false,flippingTime:700});
pf.loadFromHTML(pages);
const counter=document.getElementById('counter');
function show(){const i=pf.getCurrentPageIndex(),n=pages.length;
  const single=pf.getOrientation()==='portrait'||i===0||i===n-1;
  counter.textContent=single?`Page ${i+1} of ${n}`:`Pages ${i+1}–${Math.min(i+2,n)} of ${n}`;}
pf.on('flip',show);pf.on('init',show);pf.on('changeOrientation',show);
document.getElementById('prev').onclick=()=>pf.flipPrev();
document.getElementById('next').onclick=()=>pf.flipNext();
document.getElementById('full').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')pf.flipNext();
  if(e.key==='ArrowLeft'||e.key==='PageUp')pf.flipPrev();if(e.key==='Home')pf.turnToPage(0);
  if(e.key==='End')pf.turnToPage(pages.length-1);});
</script>
